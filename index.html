<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Holidays 2021</title>
	<link rel="stylesheet" href="css/slideshow.css" />
	<script defer src="js/slideshow.js"></script>
</head>
<body>
	<div id="page">
		<h1>Holidays 2021</h1>
		<div id="flex-main">

			<div id="slideshow">
				<img id="slideImage" src="images/slide0.jpg" alt="The boat" width="320" height="240" />
				<div id="buttons">
					<button type="button" id="btnNext">Next</button>
				</div>
			</div>

			<div id="timer">
				<h3>Timer controls</h3>
				<button type="button" id="btnOnOff">Auto mode</button>
				<select name="delay" id="delay">
					<option value="fast">fast</option>
					<option value="medium">medium</option>
					<option value="slow">slow</option>
				</select>
			</div>

		</div>
	</div>
</body>
</html>
